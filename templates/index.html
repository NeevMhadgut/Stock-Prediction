<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Market Analysis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container text-center mt-5">

    <h1 class="display-4">
        📈 Stock Market Analysis Dashboard
    </h1>

    <p class="lead mt-3">
        Technical Analysis of 50 NIFTY Stocks using Python & Flask
    </p>

    <hr>

    <div class="row mt-5">

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h3>50</h3>
                <p>Stocks</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h3>ATH</h3>
                <p>Analysis</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h3>RSI</h3>
                <p>Divergence</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow p-3">
                <h3>Swing</h3>
                <p>Analysis</p>
            </div>
        </div>

    </div>

    

    <a href="{{ url_for('show_dashboard') }}" class="btn btn-primary btn-lg mt-5">
    Open Dashboard
    </a>

</div>

</body>
</html>
