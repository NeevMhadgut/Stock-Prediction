<!DOCTYPE html>
<html>

<head>

    <title>Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4 text-center">
        📥 Stock Analysis Reports
    </h1>

    <div class="card shadow p-4">

        <table class="table table-hover">

            <thead>

                <tr>
                    <th>Report</th>
                    <th>Download</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>ATH Report</td>
                    <td>
                        <a href="{{ url_for('download_report', filename='ATH_Report.xlsx') }}"
                           class="btn btn-success">
                            Download
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>RSI Divergence Report</td>
                    <td>
                        <a href="{{ url_for('download_report', filename='RSI_Divergence_Report.xlsx') }}"
                           class="btn btn-success">
                            Download
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>Weekly Swing Report</td>
                    <td>
                        <a href="{{ url_for('download_report', filename='Weekly_Swing_Report.xlsx') }}"
                           class="btn btn-success">
                            Download
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>Summary Dashboard</td>
                    <td>
                        <a href="{{ url_for('download_report', filename='Summary_Dashboard.xlsx') }}"
                           class="btn btn-success">
                            Download
                        </a>
                    </td>
                </tr>

            </tbody>

        </table>

        <div class="text-center mt-4">

            <a href="{{ url_for('show_dashboard') }}"
               class="btn btn-secondary">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
